services:
  ui-storybook:
    image: ${REGISTRY_PREFIX}ui-storybook:${IMAGE_TAG}
    build: .
    environment:
      - TZ=Pacific/Auckland
    networks:
      - aether-net
    labels:
      - "com.docker.compose.project=${STACK_NAME}"
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.ui-storybook.rule=Host(`storybook.${DOMAIN_NAME}`)"
        - "traefik.http.routers.ui-storybook.entrypoints=websecure"
        - "traefik.http.routers.ui-storybook.tls=true"
        - "traefik.http.routers.ui-storybook.tls.certresolver=cloudflare"
        - "traefik.http.routers.ui-storybook.middlewares=authentik@docker"
        - "traefik.http.services.ui-storybook.loadbalancer.server.port=8080"
        - "traefik.docker.network=aether-net"

networks:
  aether-net:
    external: true
